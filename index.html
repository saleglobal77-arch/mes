<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<title>MES Timeline</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/main.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar-scheduler@6.1.11/index.global.min.js"></script>

<style>

html,body{
    margin:0;
    padding:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
}

#topbar{
    display:flex;
    gap:10px;
    padding:10px;
}

.kpi-box{
    background:#1e293b;
    border-radius:10px;
    padding:15px;
    width:180px;
}

.kpi-title{
    font-size:14px;
}

.kpi-value{
    font-size:30px;
    font-weight:bold;
}

#calendar{
    height:85vh;
    padding:10px;
}

</style>

</head>

<body>

<div id="topbar">

    <div class="kpi-box">
        <div class="kpi-title">RUNNING</div>
        <div class="kpi-value" id="runCount">0</div>
    </div>

    <div class="kpi-box">
        <div class="kpi-title">WAITING</div>
        <div class="kpi-value" id="waitCount">0</div>
    </div>

    <div class="kpi-box">
        <div class="kpi-title">DELAY</div>
        <div class="kpi-value" id="delayCount">0</div>
    </div>

    <div class="kpi-box">
        <div class="kpi-title">OUTPUT</div>
        <div class="kpi-value" id="outputQty">0</div>
    </div>

</div>

<div id="calendar"></div>

<script>

document.addEventListener('DOMContentLoaded', function() {

    var calendarEl = document.getElementById('calendar');

    var calendar = new FullCalendar.Calendar(calendarEl, {

        schedulerLicenseKey:
        'CC-Attribution-NonCommercial-NoDerivatives',

        initialView:'resourceTimelineMonth',

        nowIndicator:true,

        editable:true,

        resourceAreaWidth:'120px',

        resourceAreaHeaderContent:'MACHINE',

        resources:[
            { id:'MC01', title:'MC01'},
            { id:'MC02', title:'MC02'},
            { id:'MC03', title:'MC03'}
        ],

        events:[

            {
         id:'1',
         resourceId:'MC01',
         title:'JOB001',
         start:'2026-05-27',
         end:'2026-06-13',
         backgroundColor:'green'
         }

            {
         id:'2',
         resourceId:'MC02',
         title:'JOB002',
         start:'2026-05-29',
         end:'2026-06-05',
         backgroundColor:'orange'
         }
            {
                id:'3',
                resourceId:'MC03',
                title:'JOB003',
                start:'2026-05-27T13:00:00',
                end:'2026-05-27T20:00:00',
                backgroundColor:'red'
            }

        ],

        eventDrop:function(info){

            alert(
                'JOB: ' +
                info.event.title +
                '\nNEW START: ' +
                info.event.start
            );

        },

        eventResize:function(info){

            alert(
                'Resize: ' +
                info.event.title
            );

        }

    });

    calendar.render();

    document.getElementById('runCount').innerText = 1;
    document.getElementById('waitCount').innerText = 1;
    document.getElementById('delayCount').innerText = 1;
    document.getElementById('outputQty').innerText = 350;

});

</script>

</body>

</html>
