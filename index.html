<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/resource-timeline@6.1.11/index.global.min.js"></script>

<style>

html,body{
    margin:0;
    padding:0;
    font-family:Arial;
    overflow:hidden;
}

#calendar{
    height:100vh;
}

</style>

</head>

<body>

<div id="calendar"></div>

<script>

document.addEventListener('DOMContentLoaded', function() {

    var calendarEl = document.getElementById('calendar');

    var calendar = new FullCalendar.Calendar(calendarEl, {

        schedulerLicenseKey: 'CC-Attribution-NonCommercial-NoDerivatives',

        initialView: 'resourceTimelineDay',

        nowIndicator:true,

        editable:true,

        resourceAreaWidth:'120px',

        resourceAreaHeaderContent:'Machine',

        resources:[
            { id:'MC01', title:'MC01'},
            { id:'MC02', title:'MC02'},
            { id:'MC03', title:'MC03'}
        ],

        events:[

            events: async function(fetchInfo, successCallback, failureCallback) {

const url =
'https://opensheet.elk.sh/1304611700/Sheet1';

const response = await fetch(url);

const data = await response.json();

const events = data.map(row => ({

title: row.Job,

start: row.Start,

end: row.End,

resourceId: row.Machine,

backgroundColor:
row.Status == 'RUN' ? 'green' :
row.Status == 'WAIT' ? 'orange' :
row.Status == 'DELAY' ? 'red' :
'gray'

}));

successCallback(events);

},


            {
                id:'2',
                resourceId:'MC02',
                title:'JOB002',
                start:'2026-05-27T09:00:00',
                end:'2026-05-27T18:00:00'
            },

            {
                id:'3',
                resourceId:'MC03',
                title:'JOB003',
                start:'2026-05-27T13:00:00',
                end:'2026-05-27T20:00:00'
            }

        ]

    });

    calendar.render();

});

</script>

</body>
</html>
